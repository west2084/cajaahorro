name: CajaAhorro - build y paquete de desarrollo

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restaurar dependencias
        run: dotnet restore CajaAhorro.sln
      - name: Compilar Release
        run: dotnet build CajaAhorro.sln --configuration Release --no-restore
      - name: Publicar binarios sin ejecutar la aplicacion
        run: dotnet publish CajaAhorro.csproj --configuration Release --no-build --output "${{ runner.temp }}/cajaahorro-publish"
      - name: Preparar paquete sin configuraciones sensibles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path '${{ runner.temp }}' 'cajaahorro-publish'
          $out = Join-Path '${{ runner.temp }}' 'cajaahorro-package'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $out -Recurse -Force
          Get-ChildItem -Path $out -Filter 'appsettings*.json' -File | Remove-Item -Force
          # ASP.NET Core Module needs web.config when hosted in IIS.
          # dotnet publish generates it for the Web SDK. Keep it in the package.
          $webConfig = Join-Path $out 'web.config'
          if (-not (Test-Path $webConfig)) { throw 'Missing web.config from dotnet publish output. IIS package is invalid.' }
          [xml]$xml = Get-Content -Path $webConfig -Raw
          $asp = $xml.SelectSingleNode('/configuration/system.webServer/aspNetCore | /configuration/location/system.webServer/aspNetCore')
          if ($null -eq $asp) { throw 'web.config is missing aspNetCore configuration at supported IIS paths.' }
          if ($asp.processPath -notin @('dotnet', '.\\CajaAhorro.exe')) { throw "Unexpected processPath: $($asp.processPath)" }
          if ($asp.processPath -eq 'dotnet' -and $asp.arguments -notmatch 'CajaAhorro\\.dll') { throw 'web.config does not reference CajaAhorro.dll.' }
          foreach ($required in @('CajaAhorro.dll', 'CajaAhorro.runtimeconfig.json', 'CajaAhorro.deps.json')) {
            if (-not (Test-Path (Join-Path $out $required))) { throw "Missing publish file: $required" }
          }
          Write-Host 'IIS publish output validated: web.config and required assemblies present.'
          $sha = '${{ github.sha }}'
          Set-Content -Path (Join-Path $out 'release-manifest.txt') -Value @("Repository=west2084/cajaahorro", "Commit=$sha", "Branch=${{ github.ref_name }}", "Build=Release", "Environment=development-package", "Deployment=NOT_PERFORMED")
          $zip = Join-Path '${{ runner.temp }}' 'cajaahorro-${{ github.run_number }}.zip'
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          Set-Content -Path (Join-Path '${{ runner.temp }}' 'SHA256.txt') -Value "$hash  $(Split-Path $zip -Leaf)"
      - name: Guardar paquete de desarrollo
        uses: actions/upload-artifact@v4
        with:
          name: cajaahorro-dev-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/cajaahorro-${{ github.run_number }}.zip
            ${{ runner.temp }}/SHA256.txt
          retention-days: 14
          if-no-files-found: error
